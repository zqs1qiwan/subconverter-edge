name = "subconverter-edge"
main = "src/worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[kv_namespaces]]
binding = "SHORT_LINKS"
id = "subconverter_edge_short_links"

[observability]
enabled = true
head_sampling_rate = 1
